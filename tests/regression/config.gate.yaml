# ── Canonical gate configuration ──────────────────────────────────────────────
# Used by gate.py (the pass/fail regression gate). Derived from config.yaml.
#
# RULES:
# - Changing rooms/styles/weights/rules here invalidates ledger comparability.
#   Bump gate_version when you do, and re-establish baselines.
# - Changing the judge prompt in run_regression.py likewise requires bumping
#   judge_version and re-establishing baselines.
# - Exactly TWO pipelines: anchor first, candidate second. gate.py rewrites the
#   candidate entry when invoked with --candidate.

version: "2.0"
created: "2026-06-11"

gate_version: "2.0"   # 2.0 (2026-07-02): cross-mode baseline, NO_BASELINE=FAIL, validity wired
                      # into the verdict, min-case enforcement, per-case floor, judge provenance,
                      # credit preflight. Baseline lookup matches judge_version only (scores come
                      # from the judge), so 1.0-era accepted baselines remain comparable.
judge_version: "1.0"
judge_model: "claude-opus-4-7"   # the API judge + validity classifier model. Changing it requires
                                 # bumping judge_version and re-establishing baselines.

api_base: "http://localhost:8080"

# Gate thresholds (consumed by gate.py, not run_regression.py)
gate:
  max_candidate_hard_rejections: 0     # any hard rejection on the candidate => FAIL
  max_median_score_drop: 0.25          # vs last accepted baseline of baseline_mode (same judge_version)
  max_single_case_drop: 1.0            # any shared case dropping more than this vs baseline => FAIL
  min_cases_evaluated: 12              # fewer judged cases (or any skipped) => run invalid (exit 2)
  baseline_mode: balanced_v7           # production mode every candidate is compared against.
                                       # This is what makes gating a NEW mode (e.g. balanced_v7_nb2)
                                       # decisive instead of an automatic NO_BASELINE pass.

# Optional extra form fields posted with every generation request.
# Uncomment to run the canonical set with post-generation AGT verification ON
# (backlog 10 ON/OFF evidence run):
# request_fields:
#   verifyAGT: "true"

pipelines:
  - mode: baseline_original
    role: anchor
    label: "Baseline"
    slug: baseline
  - mode: balanced_v7
    role: candidate
    label: "Candidate"
    slug: candidate

# Canonical case set: 4 fixture rooms x 3 styles (LOW/MEDIUM/HIGH style pressure)
# = 12 cases. Scenario coverage beyond style-only (moodboard, furniture
# injection, catalogue selections) is gate v2 work — the current harness only
# exercises style transforms.
rooms:
  - id: bathroom
    label: "Bathroom"
    room_type: bathroom
    fixture: bathroom.png
  - id: kitchen2
    label: "Kitchen 2"
    room_type: kitchen
    fixture: kitchen2.jpg
  - id: livingroom
    label: "Living Room"
    room_type: living_room
    fixture: livingroom.jpg
  - id: bedroom2
    label: "Bedroom 2"
    room_type: bedroom
    fixture: bedroom2.png

styles:
  - id: japandi
    name: "Japandi"
    bucket: LOW
  - id: coastal
    name: "Coastal"
    bucket: MEDIUM
  - id: vintage
    name: "Vintage"
    bucket: HIGH

style_influence: 50

scoring_weights:
  structural_fidelity: 0.20
  window_exterior_preservation: 0.15
  style_fidelity: 0.15
  material_hierarchy: 0.15
  staging_density: 0.10
  functional_realism: 0.10
  design_fidelity: 0.10
  defects_artifacts: 0.05

hard_rejection_rules:
  - "New wall, door, or window added"
  - "Window removed, replaced by wall/object, or window count changed"
  - "Window geometry significantly altered (moved, resized, or blocked by opaque surface)"
  - "Exterior view removed or replaced by an interior object"
  - "Major camera or perspective shift"
  - "Impossible geometry"
  - "Severe rendering artifact"
  - "Floating or unsupported objects"
  - "Visible cables, cords, or clutter that should be removed"
  - "Corrupted or incomplete image"
