# Legacy sandbox service (`reform-ai-vis`, us-central1, private — invoked by the
# Netlify proxy in netlify/functions/api.mjs).
#
# Deliberately manual-only since the QA/PROD environments were split out:
# pushing to main deploys reform-ai-vis-prod, and this service is no longer part
# of that path. Kept so the sandbox can still be updated on purpose, rather than
# riding along on every merge to main.
name: Deploy vis-service to Cloud Run (legacy sandbox, manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Extract GCP project ID from credentials
        id: gcp
        run: |
          PROJECT_ID=$(echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' | jq -r .project_id)
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy reform-ai-vis \
            --source apps/vis-service \
            --region us-central1 \
            --project ${{ steps.gcp.outputs.project_id }} \
            --set-env-vars API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --quiet
